<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phone Screen Link</title>
  <!-- The engine builds its own DOM (device-view / video / control-buttons-list).
       Its stylesheet carries the layout rules for that DOM; without it the
       toolbox buttons render unstyled and the touch layer stops overlapping
       the picture. Ours loads after so the theme wins. -->
  <link rel="stylesheet" href="/ws-scrcpy.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="/ws-scrcpy.umd.js"></script>
</head>
<body>
  <main class="shell">
    <div class="nav-bar" aria-label="Phone controls">
      <button type="button" data-key="home">HOME</button>
      <button type="button" data-key="back">BACK</button>
      <button type="button" data-key="overview">APPS</button>
      <button type="button" data-key="volume_down">VOL&minus;</button>
      <button type="button" data-key="volume_up">VOL+</button>
      <button type="button" data-key="power">POWER</button>
    </div>
    <div id="stream" aria-label="Phone screen"></div>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
