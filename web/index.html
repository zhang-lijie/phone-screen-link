<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phone Screen Link</title>
  <!-- The engine builds its own DOM (device-view / video / control-buttons-list).
       Its stylesheet carries the layout rules for that DOM; without it the
       toolbox buttons render unstyled and the touch layer stops overlapping
       the picture. Ours loads after so the theme wins. -->
  <link rel="stylesheet" href="/ws-scrcpy.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="/ws-scrcpy.umd.js"></script>
</head>
<body>
  <main class="shell">
    <div class="nav-bar" aria-label="Phone controls">
      <button type="button" data-key="home">HOME</button>
      <button type="button" data-key="back">BACK</button>
      <button type="button" data-key="overview">APPS</button>
      <button type="button" data-key="volume_down">VOL&minus;</button>
      <button type="button" data-key="volume_up">VOL+</button>
      <button type="button" data-key="power">POWER</button>
    </div>
    <div id="stream" aria-label="Phone screen"></div>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <div id="settings-overlay" class="settings-overlay" hidden>
    <section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <header class="settings-head">
        <h2 id="settings-title">Stream settings</h2>
        <button type="button" id="settings-close" aria-label="Close settings">&times;</button>
      </header>
      <label class="setting-row">
        <span>Resolution</span>
        <select id="set-resolution">
          <option value="auto">Auto (recommended)</option>
          <option value="1280">1280 — sharpest</option>
          <option value="1080">1080 — reliable</option>
          <option value="720">720 — lightest</option>
        </select>
      </label>
      <label class="setting-row">
        <span>Frame rate</span>
        <select id="set-fps">
          <option value="15">15 fps</option>
          <option value="30">30 fps</option>
          <option value="60">60 fps</option>
        </select>
      </label>
      <label class="setting-row">
        <span>Bitrate</span>
        <select id="set-bitrate">
          <option value="2000000">2 Mbps</option>
          <option value="4000000">4 Mbps</option>
          <option value="8000000">8 Mbps</option>
          <option value="16000000">16 Mbps</option>
        </select>
      </label>
      <label class="setting-row setting-row--check">
        <span>Audio</span>
        <input type="checkbox" id="set-audio">
      </label>
      <p class="settings-note">Auto tries 1280 first and steps down if the phone rejects it. Applying restarts the picture.</p>
      <footer class="settings-actions">
        <button type="button" id="settings-reset">Reset</button>
        <button type="button" id="settings-apply">Apply &amp; restart</button>
      </footer>
    </section>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
